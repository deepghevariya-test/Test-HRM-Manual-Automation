name: 🌙 Nightly Build & Full Test Suite

on:
  # Nightly at 2 AM IST = 8:30 PM UTC previous day
  schedule:
    - cron: '30 20 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'regression-suite'
        type: choice
        options: [smoke-test, regression-suite, parallel-execution]

env:
  JAVA_VERSION: '17'

jobs:
  # ════════════════════════════════════════════════
  #  FULL REGRESSION
  # ════════════════════════════════════════════════
  nightly-selenium:
    name: 🌙 Nightly Selenium (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      matrix:
        browser: [chrome, firefox, edge]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: ☕ Java Setup
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - uses: browser-actions/setup-chrome@latest
      - uses: browser-actions/setup-firefox@latest

      - name: 🏗️ Build
        working-directory: 01-Selenium-Automation
        run: mvn clean compile -q -DskipTests

      - name: 🌙 Run Nightly Regression
        working-directory: 01-Selenium-Automation
        run: |
          mvn test \
            -Dsuite=${{ github.event.inputs.test_suite || 'regression-suite' }} \
            -Dbrowser=${{ matrix.browser }} \
            -Dheadless=true \
            --no-transfer-progress

      - name: 📸 Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-screenshots-${{ matrix.browser }}
          path: 01-Selenium-Automation/screenshots/
          retention-days: 14

  # ════════════════════════════════════════════════
  #  API TESTS
  # ════════════════════════════════════════════════
  nightly-api:
    name: 🌙 Nightly API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 🔌 Run RestAssured Tests
        working-directory: 02-API-Testing/RestAssured_Java
        run: mvn test --no-transfer-progress

      - name: 📮 Setup Newman
        run: npm install -g newman newman-reporter-html

      - name: 📮 Run Newman
        working-directory: 02-API-Testing
        run: |
          newman run Postman_Collections/HRM_API_Collection.json \
            -e Postman_Collections/HRM_Environment.json \
            --reporters cli,html \
            --reporter-html-export Newman_Reports/nightly_report.html \
            --timeout-request 30000 \
            || echo "Newman completed with some failures"

  # ════════════════════════════════════════════════
  #  NOTIFY
  # ════════════════════════════════════════════════
  notify-nightly:
    name: 📢 Nightly Notification
    runs-on: ubuntu-latest
    needs: [nightly-selenium, nightly-api]
    if: always()

    steps:
      - name: 📊 Nightly Build Summary
        run: |
          echo "================================================"
          echo "  HRM Nightly Build Summary"
          echo "  Date: $(date '+%Y-%m-%d %H:%M IST')"
          echo "  Selenium: ${{ needs.nightly-selenium.result }}"
          echo "  API Tests: ${{ needs.nightly-api.result }}"
          echo "================================================"

      - name: 💬 Slack Notification
        uses: slackapi/slack-github-action@v1.25.0
        if: always()
        with:
          payload: |
            {
              "text": "${{ needs.nightly-selenium.result == 'success' && needs.nightly-api.result == 'success' && '✅' || '❌' }} *HRM Nightly Build* - ${{ github.run_id }}\n*Selenium:* ${{ needs.nightly-selenium.result }} | *API:* ${{ needs.nightly-api.result }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
