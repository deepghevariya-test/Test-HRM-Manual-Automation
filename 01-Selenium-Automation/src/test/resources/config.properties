# ============================================================
#  HRM Automation Framework - Configuration
#  IMPORTANT: Never commit real credentials to version control
#  Use environment variables or CI/CD secret injection in production
# ============================================================

# ──────────────────────────────────────────────
#  Application Settings
# ──────────────────────────────────────────────
# OrangeHRM Demo Application
base.url=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login
environment=QA

# Credentials (use CI/CD secrets in production, never hardcode in real projects)
admin.username=Admin
admin.password=admin123

# HR Manager Role (if available on demo)
hr.username=Admin
hr.password=admin123

# Employee Role
employee.username=Pam.Job
employee.password=Pam@123

# ──────────────────────────────────────────────
#  Browser Configuration
# ──────────────────────────────────────────────
browser=chrome
headless=false

# ──────────────────────────────────────────────
#  Timeouts (in seconds)
# ──────────────────────────────────────────────
implicit.wait.sec=10
explicit.wait.sec=15
page.load.timeout.sec=30

# ──────────────────────────────────────────────
#  Test Data Files
# ──────────────────────────────────────────────
test.data.dir=src/test/resources/testdata/
employee.data.file=src/test/resources/testdata/employees.xlsx
employee.sheet.name=EmployeeData
leave.data.file=src/test/resources/testdata/leave_data.json
credentials.file=src/test/resources/testdata/login_credentials.csv

# ──────────────────────────────────────────────
#  Reporting
# ──────────────────────────────────────────────
report.dir=reports/
screenshot.dir=screenshots/
extent.report.name=HRM_AutomationReport

# ──────────────────────────────────────────────
#  API Configuration (for API Tests)
# ──────────────────────────────────────────────
api.base.url=https://opensource-demo.orangehrmlive.com
api.auth.endpoint=/web/index.php/auth/validate

# ──────────────────────────────────────────────
#  Retry Configuration
# ──────────────────────────────────────────────
retry.count=2
